services:
  mongo:
    image: mongodb/mongodb-atlas-local:8.0
    container_name: mongodb_hospital_api
    restart: always
    environment:
      MONGODB_INITDB_ROOT_USERNAME: chheun
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb

volumes:
  mongo_data:
  mongo_config:

# Connect directly inside the Docker container via CMD:
# docker exec -it mongodb_hospital_api mongosh hospital_nosql -u chheun -p "chheun^^1223" --authenticationDatabase admin

# Or connect from host CMD via mongosh:
# mongosh -u chheun -p "chheun^^1223" --authenticationDatabase admin "mongodb://127.0.0.1:27018/hospital_nosql?directConnection=true"
